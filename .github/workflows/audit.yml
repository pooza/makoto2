# 依存の脆弱性スキャン（#104）。
#
# 🔴 **`test.yml` に足さない。**⚠⚠ **`bundler-audit` は外部の advisory DB を引く**
# ので、⚠ **コードを 1 行も触っていないのに、DB が更新された日に緑が赤へ変わる。**
# **赤が常態化すると誰も見なくなる**（`pooza/ginseng-core#508` と同じ壊れ方）ので、
# 🔴 **「気付く」と「止める」を分ける** — **リリースの経路は Dependabot と
# リリース手順 3 のまま**にして、**取りこぼしの検知だけをここで自動化する。**
#
# ⚠ **2026-08-18 に Dependabot が `sqlite3` の Use-After-Free
# （GHSA-mwm8-39rw-8826）を拾っていなかった**のが起票の理由（→ #104）。
name: audit
on:
  schedule:
    # ⚠ 月曜 03:00 JST（＝ 日曜 18:00 UTC）。Dependabot と同じ時間帯に寄せる。
    - cron: '0 18 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: apt install
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      # ⚠ 落ちても次の手順へ進む（見つかったことを Issue に落とすため）。
      - name: bundler-audit
        id: audit
        run: |
          set +e
          bundle exec bundle-audit check --update 2>&1 | tee audit.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      # 🔴 **見つかったら Issue に落とす。**⚠⚠ **週次で同じ Issue を増やさない** —
      # **開いているものがあればコメントで足す。**
      - name: report
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'chore: bundler-audit が脆弱性を報告している'
        run: |
          body=$(printf '⚠ **週次の `bundler-audit` が報告しました**（[run](%s/%s/actions/runs/%s)）。\n\n```\n%s\n```\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat audit.txt)")
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label bug --body "$body"
          fi
