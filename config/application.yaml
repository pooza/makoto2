environment: development
announcement:
  # 11/1 からの予告投稿（#14）。⚠ **予告開始が 11/1 なので、これが機能的な締め切り**
  # （→ docs/birthday-live.md）。
  #
  # ⚠⚠ **日付はここに書かない。**枠は毎日あり、その日の原稿が無ければ何も投稿しない
  # （MessageSelector が nil を返す）。日付は原稿の側と /message/anniversary が持つ。
  # ⚠ **予告を止めるのは原稿を消すだけ**でよいので、機能のフラグは持たない。
  type: announcement
  # ⚠ 1 日 1 本。**finish は含まない（半開区間）**ので、この幅で枠は 10:00 の 1 つ。
  #
  # ⚠ **10:00 なのは人に届く時刻だから。**11/1 が意味を持つのは日曜＝ニチアサ実況で
  # キュアスタ！が最も賑わう日だという理由なので、その流れの残っている時間に置く。
  # ⚠ ライブ本体の開始（12:00）に揃える理由は無い。
  # ⚠⚠ **朝挨拶（#17）の枠と重ねないこと。**同じ時刻に 2 本出る。
  # ⚠⚠ **11/3 の増量でここを広げないこと。**枠は日付を区別しないので、広げると
  # 11/1 と 11/2 も一緒に増える。増量は #13 が別の枠として足す。
  timetable:
    start: '10:00'
    finish: '10:01'
    interval: '1m'
live:
  # 11/4 バースデーライブ SONGBIRD PARTY 2026（#13）。**このプロジェクトのゴール**
  # （→ docs/birthday-live.md）。
  #
  # ⚠⚠ **日付はここに書かない。**ライブの日の正本は /message/anniversary で、
  # open の type が登録されている日がライブの日（→ LiveProgram#live_day?）。
  # ⚠ 日付を動かすのに /message/anniversary と原稿だけを触ればよい形にする。
  #
  # 8 時間の進行。⚠ **12:00 と 20:00 は告知の枠なので、曲は 12:02 から始めて
  # 20:00 を含めない（半開区間）。**最後の曲は 19:59。
  #
  # ⚠ 3 分間隔なのは、ライブ用 vocal が重複を寄せると 134 曲しか無いから。
  # 2 分にすると曲と MC がほぼ交互になり、MC を 100 本以上書くことになる。
  timetable:
    start: '12:02'
    finish: '20:00'
    interval: '3m'
  # ⚠⚠ **投稿の最終行をハッシュタグだけの行にする**（#64）。モロヘイヤがその形を
  # 処理する。⚠ **ライブの 4 枠すべてに機械的に付く**（曲の投稿は原稿ではないので、
  # 原稿の側に書き足す形にすると曲だけ付かない → HashtagSource）。
  # ⚠ **空にすれば止まる。**機能のフラグを別に持たない。来年は年号だけ差し替える。
  hashtag: '#SONGBIRD_PARTY_2026'
  setlist:
    # ⚠ アンカーの 2 曲だけは曲名で指す。⚠⚠ **引けなければその位置を諦める**
    # （黙って別の曲を置かない → Setlist）。
    #
    # ⚠ 〜SONGBIRD〜 はライブ名の由来そのもので、開始直後と中盤（前後編の蝶番）の
    # 2 回歌う。元ネタ（Song Party♪ vol.8）が第 1 部の本編ラストと第 2 部の冒頭に
    # 置いている。
    opening: 〜SONGBIRD〜
    # ⚠ こころをこめて はアルバムの最終曲で、実際のイベントでもラストになりやすい。
    # ⚠⚠ この曲の重みは四層あり、うち三層は MAKOTO には口に出せない。
    # **曲順という語らない手段で回収する**（→ docs/birthday-live.md）。
    closing: こころをこめて
    # ゲストコーナー 1 つあたりの曲数。⚠ 前半・後半に 1 つずつ置くので 2 倍が総数。
    #
    # ⚠⚠ **カバーはライブ用に入っていない vocal＝他の歌手の持ち歌**から引く。
    # 元ネタが各部にゲストコーナーを持つのに対応する。
    # ⚠ **いま引けるのはプリキュアソングだけ**（収集の網に非プリキュアが無い → #55）。
    cover_size: 4
    cover_prefix: 今日はカバーもやります。
    # ⚠⚠ **単独名義の曲を優先して引く重み**（#65）。**MAKOTO は 1 人で歌う**ので、
    # 本来複数の歌手で歌う曲を 1 人でカバーするのは不自然。
    # ⚠ **排除ではなく寄せる**（ありえなくはない）。⚠ **1 以下なら一様抽選**＝この
    # 機能は切れる。
    #
    # ⚠ 実測（2026-08-15）では絞り込みそのものが多名義に寄せる度合いは小さく
    # （単独 66.4% → 62.8%）、⚠⚠ **4 名義以上はむしろ減っていた。**効果は小さいが、
    # 選曲の方針を仕組みの側に持たせておく（データが変われば比率も変わる）。
    # ⚠ 3 だと 11/4 の引きが 8/8 単独になり、「寄せる」ではなく実質「排除」だった
    # （実測）。連名も混ざる余地を残すため 2 にしてある。
    cover_solo_weight: 2
    # ⚠⚠ **本編から外す曲**（#63）。童謡の仕事は歌手としての引き出しなので残すが、
    # ⚠ **発売日順に並べる以上、同じアルバムの曲は必ず隣接する**ため、そのまま
    # 入れると塊で流れる（実測で 10 曲・うち 4 曲が中盤の蝶番の直後に連続した）。
    #
    # ⚠⚠ **`live` フラグ（seed）では外さない。**フラグは「本人の曲」の印でもあり、
    # 落とすと**本編から消えた曲がカバー母集合に流れ込む**（→ Setlist#excluded?）。
    #
    # ⚠ 日常の曲紹介（#16）には掛からない。あちらは「紹介」であって「カバーして
    # 歌う」テイではないので、絞る理由が無い。
    exclude:
      collections:
        # 劇のアルバム。⚠ オープニング／エンディング／掛け合いは場面の構成物で、
        # 単独で流すと歌ではなく断片に見える。
        - あそび劇シアター 3びきのやぎとトロル/さるかにがっせん/ピンポーン
      tracks:
        # ⚠ 4 名義。MAKOTO は 1 人で歌う（→ #65 と同じ観点）。
        - みんなでいこう![7月]
  # 開始告知。⚠⚠ **ミュート導線をここに書く**（#13 の完了条件・参加は任意）。
  open:
    type: live_open
    timetable:
      start: '12:00'
      finish: '12:01'
      interval: '1m'
  # 曲と曲の間の語り。⚠ **原稿を頭から順に消化する**（乱択ではない → LiveProgram）。
  # ⚠ 用意した本数より枠が多ければ頭に戻る。
  mc:
    type: live_mc
    # ⚠⚠ **蝶番（`〜SONGBIRD〜` の再演）の直後に置く台本の `slug`**（#73）。
    # ⚠ **`後半。` は蝶番より前に出ると嘘になる**が、台本は「MC の何番目か」、
    # 蝶番は「曲の何番目か」で位置が決まるので、⚠⚠ **曲数が 1 曲動くだけで
    # 入れ替わる**（#58 で実際に起きた）。⚠ **引けなければ通常の割合で引く。**
    hinge: live-mc-08
  close:
    type: live_close
    timetable:
      start: '20:00'
      finish: '20:01'
      interval: '1m'
  # 前日（11/3）の増量。⚠ **別の枠として持つ**（予告の枠を広げると 11/1 と 11/2 も
  # 一緒に増える → docs/CLAUDE.md）。2024 年は 11/3 が 14 投稿・平常時は 5〜7。
  eve:
    type: live_eve
    timetable:
      start: '12:00'
      finish: '20:00'
      interval: '1h'
cure_api:
  # プリキュアの情報の正本（https://github.com/pooza/cure-api）。
  # ⚠⚠ rubicure を直接使わない。⚠ 足りない情報は MAKOTO に抱え込まず cure-api を伸ばす。
  #
  # ⚠ ライブ（#13）のゲストコーナーが /singers を引き、カバーを
  # 「プリキュア歌手の持ち歌」に限る。絞らないとカラオケレーベル（歌っちゃ王）や
  # オルゴール盤・ドラマトラックが混ざる。
  # ⚠⚠ 落ちてもライブは止めない（カバーを置かずに警告を残す）。
  url: https://cure-api.precure.ml
corpus:
  # 旧 DB から取り出したコーパスの置き場（`makoto corpus import` の取り込み元）。
  # ⚠ var/ はコミットしない。台詞は第三者の著作物のため（.gitignore 参照）。
  dir: var/corpus
track:
  # 曲データ（iTunes Search API の収集物）の置き場。⚠ 台詞と違って git 管理下に
  # あるので、clone すればそのまま `makoto track import` が通る。
  dir: seed
  # 抽選の重み。⚠ **その kind が選ばれる確率の比**であって、曲数の割合ではない。
  # 既定値の根拠は docs/track-corpus.md を見ること。
  # ⚠ 普段用は BGM が 53% なので、一様に引くと曲紹介がサントラだらけになる。
  weight:
    vocal: 10
    bgm: 4
    tv_size: 1
    karaoke: 1
    instrumental: 1
http:
  retry:
    limit: 3
    seconds: 1
  timeout:
    seconds: 30
logger:
  mask_fields:
    - password
    - secret
    - token
    - access_token
    - api_key
    - authorization
    - code
monitor:
  # 監視（Uptime Kuma）が叩く HTTP の口（#84 → MonitorApp / MonitorServer）。
  #
  # ⚠⚠ **既定は 127.0.0.1。**⚠ **開けるのは箱ごとに config/local.yaml へ
  # `bind: 0.0.0.0` を書く明示的な一手にする**ので、「開いていない」が既定のまま残る。
  # ⚠⚠ **LAN 限定・読み取り専用の死活の口だけ**で、管理コンソールは作らない
  # （→ docs/CLAUDE.md「管理操作は CLI で行う」）。
  #
  # ⚠ **切るとポートが開かないので Kuma からは「落ちている」と見える。**ここで
  # 監視そのものを止めるつもりなら、Kuma 側のモニタも一緒に止めること。
  enabled: true
  bind: 127.0.0.1
  # ⚠ tomato-shrieker と同じ番号。**別の箱なので衝突しない**（本番は非同居）。
  # Kuma への登録を他の ginseng 系ボットと同じ形にしておく。
  port: 4567
package:
  authors:
    - Tatsuya Koishi
  description: Mastodon サーバー「キュアスタ！」で稼働する AI マスコットボット MAKOTO。
  email:
    - tkoishi@b-shock.co.jp
  license: MIT
  url: https://github.com/pooza/makoto2
  version: 0.2.2
message:
  # 記念日。⚠⚠ **旧データの `birthday` 23 件は `month` / `day` が全行 NULL で、
  # 「11/4 に出す」判定は日付列ではなく type の側で行われていた。**その日付の正本が
  # ここ。⚠ **ここに挙げた type は、その日以外では選ばれない**（毎朝バースデーの
  # 原稿が出ないようにするため）。
  #
  # ⚠ 11/4 は剣崎真琴と声優（宮本佳那子）の誕生日が重なる日（→ docs/CLAUDE.md）。
  #
  # ⚠⚠ **1 日に複数の type を書ける**（#13）。11/3 は予告と前日増量、11/4 は誕生日と
  # ライブの台本が同居する。⚠ **1 日 1 type だと後から来たほうが登録できず、
  # 日付を持たない原稿が段 5 に漏れて毎日出る。**
  anniversary:
    # ⚠ 引用符を外さない。`11-04` は YAML が数値・日付と取り違えうる書き方。
    #
    # ⚠⚠ **予告（#14）の 3 日もここに要る。**登録が無いと、日付を持たない
    # `announcement` の原稿が段 5（無指定）に混ざって**毎日予告が出る**。
    # ⚠ Announcement はこの登録が無ければ起動時に落ちる（黙って毎日出るより早い）。
    '11-01': announcement
    '11-02': announcement
    '11-03':
      - announcement
      - live_eve
    # ⚠⚠ **open の type が登録されている日がライブの日**（→ LiveProgram#live_day?）。
    # 曲は原稿ではないので、これが無いと毎日 8 時間ぶんの曲が流れる。
    '11-04':
      - birthday
      - live_open
      - live_mc
      - live_close
scheduler:
  heartbeat:
    interval: 1h
  # 枠の頭を拾う幅（#90）。⚠ **tick はぴったりの時刻には来ない**ので、この幅だけ
  # 遅れて呼ばれても枠を拾う。
  #
  # ⚠⚠ **tick と同じ値にしない。**同値だと拾えるのは tick が `[枠の頭, 枠の頭+tick)`
  # に落ちたときだけで、⚠ **余裕が構造的にゼロ**になる。⚠⚠ **ライブの枠間隔 180 秒は
  # tick の 10 秒の整数倍なので、位相ずれは 160 枠すべてに同じように効く**
  # （1 枠だけの事故にならない）。
  #
  # ⚠ **枠の間隔より短いこと**（`PostingJob#validate` が起動時に落とす）。いちばん短い
  # 枠は予告・告知の 1m なので、ここは 60 秒未満に収めること。
  #
  # ⚠ **広げても二重投稿にはならない** — 同じ枠なら冪等キーが同じで Mastodon 側が畳む。
  tolerance: 30s
  # 枠の頭を拾いに行く間隔。⚠ **枠ごとにジョブを登録せず、この間隔で叩いて
  # 「いま枠の頭か」を時刻から計算する**（→ Scheduler / PostingJob）。
  # ⚠⚠ **枠の間隔はこれより長いこと。**短いと 1 回の叩きが複数の枠に跨がり、
  # 取りこぼす（PostingJob が起動時に弾く）。ライブは 2 分間隔なので十分余裕がある。
  tick: 10s
  # tick が回らなくなったとみなすまでの猶予（#80 の黄 7）。
  #
  # ⚠⚠ **ハートビートは tick とは別の rufus ジョブ**なので、⚠ **tick 側だけが詰まっても
  # ハートビートの痕跡は更新され続ける**（＝「生きているが投稿していない」が
  # 検知できない）。そこで **tick が回った時刻を別に記録して、こちらで見る。**
  #
  # ⚠ **tick の間隔（10s）を基準にしない。**⚠⚠ **1 回の tick は投稿の再送で 90 秒以上
  # かかりうる**ので、間隔の数倍では誤報する。⚠ **rufus の `every` は重なって走る**
  # （詰まった 1 回が後続を止めない）ので、**間隔ではなく「何分止まったら異常か」で
  # 決める。**
  #
  # ⚠ **5 分なのはライブの枠間隔（3 分）を基準にしたから。**⚠⚠ **1 枠飛ばした時点で
  # 気付ける**が、⚠ 1 回の tick が伸びただけでは鳴らない。
  tick_stale: 5m
  posting:
    # 何本続けて落ちたら `makoto status` が警告（2）を返すか（#78）。
    #
    # ⚠⚠ **数えるのは「本文があるのに出せなかった枠」だけ。**原稿が無い日の枠は
    # 数に入らないので、⚠ **8/15〜10/31 のように 1 本も投稿しない期間があっても
    # 誤検知しない**（→ Heartbeat）。
    #
    # ⚠ **3 なのはライブ当日を基準にしたから。**枠は 3 分間隔なので、⚠⚠ **160 枠が
    # 全滅する形なら 10 分弱で気付ける。**平常日（数本／日）でも同じ日のうちに出る。
    # ⚠ **1 にすると Mastodon 側の一時的な失敗で毎回鳴る**（再送は HTTP 層が済ませた
    # 後なので、ここまで来る失敗自体は珍しくない）。
    failure_limit: 3
  # ⚠ 投稿時刻の解釈に使う唯一の正本。ライブは 12:00 JST に始まるので、稼働先の
  # ローカルタイムが UTC だと 9 時間ずれる。しかも「起動したのに何も起きない」だけ
  # なので気付きにくい。ホストの TZ に依存させない。
  timezone: Asia/Tokyo
sqlite3:
  db: makoto.db
