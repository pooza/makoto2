environment: development
corpus:
  # 旧 DB から取り出したコーパスの置き場（`makoto corpus import` の取り込み元）。
  # ⚠ var/ はコミットしない。台詞は第三者の著作物のため（.gitignore 参照）。
  dir: var/corpus
http:
  retry:
    limit: 3
    seconds: 1
  timeout:
    seconds: 30
logger:
  mask_fields:
    - password
    - secret
    - token
    - access_token
    - api_key
    - authorization
    - code
package:
  authors:
    - Tatsuya Koishi
  description: Mastodon サーバー「キュアスタ！」で稼働する AI マスコットボット MAKOTO。
  email:
    - tkoishi@b-shock.co.jp
  license: MIT
  url: https://github.com/pooza/makoto2
  version: 0.1.0
scheduler:
  heartbeat:
    interval: 1h
sqlite3:
  db: makoto.db
