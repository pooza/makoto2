# config/local.yaml の雛形。秘密情報を書く場所で、コミットしない（config/.gitignore）。
# 実際の値はインフラノート（pooza/chubo2・private）側に置く。
# CI はこの雛形をそのままコピーして使う（CI に秘密情報を持たせない）。
environment: development
mastodon:
  # 開発・検証はキュアスタ！のステージング。本番は https://precure.ml
  url: https://st2.precure.ml
  acct: test
  token: CHANGE_ME
  # 🔴 **モロヘイヤを経由するか**（#124）。⚠ **既定は config/application.yaml の
  # `true`（＝経由する）。**⚠⚠ **ここに `false` を書くと `X-Mulukhiya` が戻って
  # Mastodon API 直になる** — **当日の切り戻しはこの 1 行。**
  # mulukhiya: false
# 監視の口（#84）。⚠ **既定は 127.0.0.1 なので、箱の外（Uptime Kuma）から叩くには
# ここで開ける。**⚠⚠ **LAN 限定の読み取り専用の口**であり、管理コンソールではない。
# ⚠ 開けるのは稼働ホストだけでよい（手元の開発では既定のまま）。
# monitor:
#   bind: 0.0.0.0

