---
# config 全体（application.yaml / local.yaml）のスキーマ。
# Ginseng::Config#errors（`rake config:lint`）が使用する。
$schema: http://json-schema.org/draft-06/schema#
title: makoto2 config
type: object
definitions:
  # 投稿の枠（→ Makoto::Timetable）。⚠ 3 つのうち 1 つでも欠けると枠が作れない。
  timetable:
    type: object
    properties:
      start:
        type: string
      finish:
        type: string
      interval:
        type: string
    required:
      - start
      - finish
      - interval
  # 前もって用意した原稿を出す枠。⚠ type は /message/anniversary にも登録すること。
  scripted_slot:
    type: object
    properties:
      type:
        type: string
      timetable:
        $ref: '#/definitions/timetable'
    required:
      - type
      - timetable
properties:
  # 予告投稿（#14）。⚠ 欠けると PostingJob が作れず、11/1 に予告が出ない。
  # ⚠⚠ 出ないことは 11/1 まで分からないので、設定の検証で止める。
  # ⚠ この type は /message/anniversary にも登録すること（登録が無いと毎日出る）。
  announcement:
    $ref: '#/definitions/scripted_slot'
  corpus:
    type: object
    properties:
      dir:
        type: string
    required:
      - dir
  # プリキュアの情報の取得先。⚠ 欠けるとライブのゲストコーナーが静かに空になる。
  cure_api:
    type: object
    properties:
      url:
        type: string
        format: uri
        pattern: '^https?://'
    required:
      - url
  # バースデーライブ（#13）。⚠ 欠けると PostingJob が作れず、11/4 に何も起きない。
  # ⚠⚠ 起きないことは 11/4 まで分からないので、設定の検証で止める。
  live:
    type: object
    properties:
      # 8 時間の進行。⚠ 12:00 と 20:00 は告知の枠なので曲は含めない。
      timetable:
        $ref: '#/definitions/timetable'
      # ⚠ 投稿の最終行に足すハッシュタグ（#64）。空なら付けない。
      hashtag:
        type: string
      setlist:
        type: object
        properties:
          # ⚠ アンカーの曲名。引けなければその位置を諦める（Setlist）。
          opening:
            type: string
          closing:
            type: string
          # ゲストコーナー 1 つあたりの曲数。⚠ 0 ならカバーを置かない。
          cover_size:
            type: integer
            minimum: 0
          cover_prefix:
            type: string
          # ⚠ 単独名義を優先する重み（#65）。1 以下なら一様抽選。
          cover_solo_weight:
            type: integer
            minimum: 0
          # ⚠ 本編から外す曲（#63）。live フラグは触らない（Setlist#excluded?）。
          exclude:
            type: object
            properties:
              collections:
                type: array
                items:
                  type: string
              tracks:
                type: array
                items:
                  type: string
        required:
          - opening
          - closing
          - cover_size
      # ⚠ 4 つの type はすべて /message/anniversary にも登録すること
      # （登録が無いと台本が毎日出る。Live#validate が起動時に落とす）。
      open:
        $ref: '#/definitions/scripted_slot'
      close:
        $ref: '#/definitions/scripted_slot'
      eve:
        $ref: '#/definitions/scripted_slot'
      mc:
        type: object
        properties:
          type:
            type: string
          # ⚠ 蝶番の直後に置く台本の slug（#73）。⚠⚠ 必須にしない —
          # 引けなければ通常の割合で引く（Setlist のアンカーと同じ判断）。
          hinge:
            type: string
          # ⚠ ゲストコーナーの塊の直前に置く台本の slug（#117）。前半・後半の順。
          # ⚠⚠ 必須にしない — 引けなければ通常の割合で引く。
          cover:
            type: array
            items:
              type: string
        required:
          - type
    required:
      - timetable
      - setlist
      - open
      - mc
      - close
      - eve
  environment:
    enum:
      - development
      - production
  # ⚠ 外への HTTP（#80 の緑 3）。⚠⚠ **origin/main からの持ち越しで、設定に在るのに
  # schema が知らなかった。**
  #
  # ⚠ **どれも運用上必須。**⚠⚠ **timeout が欠けると 1 本の投稿が最悪 92 秒 →
  # 既定の 60 秒 × 再送で枠を跨ぐ**（#90 で塞いだところがそのまま戻る）。
  # ⚠ **retry が欠けると `Ginseng::HTTP` が起動時に落ちる**（`retry_limit` を素で読む）。
  http:
    type: object
    properties:
      retry:
        type: object
        properties:
          # ⚠ 再送の回数。⚠⚠ 0 でも意味を持つ（再送しない）ので minimum は 0。
          limit:
            type: integer
            minimum: 0
          # 再送までの待ち（秒）。
          seconds:
            type: number
            minimum: 0
        required:
          - limit
          - seconds
      timeout:
        type: object
        properties:
          # ⚠⚠ これは wall-clock の上限ではない（Net::HTTP の 1 回の socket 操作ごと
          # → #92）。⚠ 黙って止まっている相手には効く。
          seconds:
            type: number
            exclusiveMinimum: 0
        required:
          - seconds
    required:
      - retry
      - timeout
  logger:
    type: object
    properties:
      # ⚠ 出すログの水準（#80 の黄 9）。⚠⚠ 読めない値でも落ちず info へ倒すが、
      # 綴りの誤りは rake config:lint で先に止める。
      level:
        type: string
        enum:
          - debug
          - info
          - warn
          - error
          - fatal
      mask_fields:
        type: array
        items:
          type: string
    required:
      - level
      - mask_fields
  mastodon:
    type: object
    properties:
      url:
        type: string
        format: uri
        pattern: '^https?://'
      acct:
        type: string
      token:
        type: string
      # 🔴 モロヘイヤを経由するか（#124）。⚠⚠ true が「経由する」＝ X-Mulukhiya を
      # 送らない（ヘッダを付けたほうが迂回する）。
      # ⚠⚠ optional_config で既定値に逃がさない — 消しただけで経路が静かに
      # 戻り、タグ付けが掛からなくなる（#77 の裏返し）。だから required に入れる。
      mulukhiya:
        type: boolean
    # ⚠ `whoami` も `post` も、この 2 つが無ければ動かない。ここに書いておかないと
    # `rake config:lint` は通り、投稿しようとした瞬間に初めて失敗する。
    required:
      - url
      - token
      - mulukhiya
  message:
    type: object
    properties:
      # 記念日。⚠ キーは `MM-DD`、値はその日に使う原稿の type。
      # ⚠⚠ ここに挙げた type は、その日以外では選ばれない。
      # ⚠ 1 日に複数の type を持てる（11/4 は誕生日とライブの台本が同居する → #13）。
      anniversary:
        type: object
        patternProperties:
          '^\d{2}-\d{2}$':
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
                minItems: 1
        additionalProperties: false
    required:
      - anniversary
  # 監視の口（#84）。⚠⚠ 3 つとも required にする — optional_config で既定値に
  # 逃がすと、⚠ 設定を消しただけで監視の口が静かに閉じる（#77 の裏返し。
  # /scheduler/posting/failure_limit と同じ判断）。
  monitor:
    type: object
    properties:
      enabled:
        type: boolean
      # ⚠ 既定は 127.0.0.1。開けるのは箱ごとに local.yaml で行う明示的な一手。
      bind:
        type: string
      port:
        type: integer
        minimum: 1
        maximum: 65535
    required:
      - enabled
      - bind
      - port
  package:
    type: object
    properties:
      version:
        type: string
      url:
        type: string
        format: uri
        pattern: '^https?://'
    required:
      - version
  scheduler:
    type: object
    properties:
      heartbeat:
        type: object
        properties:
          interval:
            type: string
        required:
          - interval
      timezone:
        type: string
      # ⚠ 枠の頭を拾う間隔。欠けると PostingJob が作れず、投稿が 1 本も出ない。
      tick:
        type: string
      # ⚠ 枠の頭を拾う幅（#90）。⚠⚠ optional_config で既定値に逃がさない —
      # 消しただけで拾う幅が tick まで縮み、静かに余裕がゼロに戻る（#77 の裏返し）。
      tolerance:
        type: string
      # ⚠ tick が回らなくなったことの検知（#80 の黄 7）。⚠⚠ optional_config で
      # 既定値に逃がさない — 消しただけで「生きているが投稿していない」の検知が
      # 静かに消える（#77 の裏返し）。
      tick_stale:
        type: string
      # 投稿が続けて落ちたことの検知（#78）。
      posting:
        type: object
        properties:
          # ⚠ 何本続けて落ちたら警告にするか。⚠⚠ 欠けると makoto status が
          # ConfigError で落ちる。既定値に逃がさないのは #77 の裏返しで、
          # 設定を消しただけで検知が静かに緩む形を作らないため。
          failure_limit:
            type: integer
            minimum: 1
        required:
          - failure_limit
    # ⚠ timezone が欠けるとホストのローカルタイムに落ちる。ライブの開始時刻がずれても
    # 「何も起きない」だけなので、設定の検証で止める。
    required:
      - heartbeat
      - timezone
      - tick
      - tolerance
      - tick_stale
      - posting
  sqlite3:
    type: object
    properties:
      db:
        type: string
    required:
      - db
  track:
    type: object
    properties:
      dir:
        type: string
      # 抽選の重み。⚠ 5 つの kind は収集スクリプトが付ける閉じた集合なので、
      # すべて required にする。欠けると、その kind が黙って永久に出なくなる。
      weight:
        type: object
        properties:
          vocal:
            type: integer
            minimum: 0
          bgm:
            type: integer
            minimum: 0
          karaoke:
            type: integer
            minimum: 0
          tv_size:
            type: integer
            minimum: 0
          instrumental:
            type: integer
            minimum: 0
        required:
          - vocal
          - bgm
          - karaoke
          - tv_size
          - instrumental
    required:
      - dir
      - weight
required:
  - announcement
  - corpus
  - cure_api
  - environment
  # ⚠ 節ごと消えたときも止める（#80 の緑 3）。⚠⚠ 中の required だけでは、
  # 節そのものが無い設定を通してしまう。
  - http
  - live
  - logger
  - mastodon
  - message
  - monitor
  - package
  - scheduler
  - sqlite3
  - track
