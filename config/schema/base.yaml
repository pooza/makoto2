---
# config 全体（application.yaml / local.yaml）のスキーマ。
# Ginseng::Config#errors（`rake config:lint`）が使用する。
$schema: http://json-schema.org/draft-06/schema#
title: makoto2 config
type: object
properties:
  corpus:
    type: object
    properties:
      dir:
        type: string
    required:
      - dir
  environment:
    enum:
      - development
      - production
  logger:
    type: object
    properties:
      mask_fields:
        type: array
        items:
          type: string
    required:
      - mask_fields
  mastodon:
    type: object
    properties:
      url:
        type: string
        format: uri
      acct:
        type: string
      token:
        type: string
    # ⚠ `whoami` も `post` も、この 2 つが無ければ動かない。ここに書いておかないと
    # `rake config:lint` は通り、投稿しようとした瞬間に初めて失敗する。
    required:
      - url
      - token
  package:
    type: object
    properties:
      version:
        type: string
      url:
        type: string
        format: uri
    required:
      - version
  scheduler:
    type: object
    properties:
      heartbeat:
        type: object
        properties:
          interval:
            type: string
        required:
          - interval
      timezone:
        type: string
      # ⚠ 枠の頭を拾う間隔。欠けると PostingJob が作れず、投稿が 1 本も出ない。
      tick:
        type: string
    # ⚠ timezone が欠けるとホストのローカルタイムに落ちる。ライブの開始時刻がずれても
    # 「何も起きない」だけなので、設定の検証で止める。
    required:
      - heartbeat
      - timezone
      - tick
  sqlite3:
    type: object
    properties:
      db:
        type: string
    required:
      - db
  track:
    type: object
    properties:
      dir:
        type: string
      # 抽選の重み。⚠ 5 つの kind は収集スクリプトが付ける閉じた集合なので、
      # すべて required にする。欠けると、その kind が黙って永久に出なくなる。
      weight:
        type: object
        properties:
          vocal:
            type: integer
            minimum: 0
          bgm:
            type: integer
            minimum: 0
          karaoke:
            type: integer
            minimum: 0
          tv_size:
            type: integer
            minimum: 0
          instrumental:
            type: integer
            minimum: 0
        required:
          - vocal
          - bgm
          - karaoke
          - tv_size
          - instrumental
    required:
      - dir
      - weight
required:
  - corpus
  - environment
  - logger
  - mastodon
  - package
  - scheduler
  - sqlite3
  - track
