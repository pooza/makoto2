# MV のある曲の一覧（#498）
#
# 🔴 **ここに書いた曲は、日常の曲紹介で音源のリンクの代わりに MV のリンクを出す。**
#   ⚠ **ライブは音源のまま**（11/4 の並びを動かさない・2026-10-29・オーナー判断）。
#
# ⚠⚠ **MV は収集の経路に乗らない。**iTunes の MV は `kind: music-video` でアルバムを持たないので、
#   アルバムの中の `song` を取る `seed/itunes_corpus.py` は拾えない。⚠ **対象が数本しか無いので、
#   収集を広げず名指しで書く**（2026-10-05・オーナー判断）。
#
# ⚠ **振りビデオは書かない**（本編の MV だけ・2026-10-29・オーナー判断）。1 曲に 1 本。
#
# ## 書き方
#
#   - name:    曲名（⚠ 供給元の表記のまま。突き合わせは `dedupe_key` ＝ 正規化と別名表の後）
#     url:     MV の URL（⚠ iTunes の `trackViewUrl` をそのまま。🔴 **`music.apple.com` の https だけ**
#              ＝ 取り込みと同じ線・#283。外れていると取り込みが落ちる。曲紹介は表が読めない扱いで
#              音源へ倒れる）
#     noticed: 気づいた日
#     reason:  ⚠ **どの MV か。**trackId と、何が映っているか
#
# ⚠ **盤違いは 1 行で済む**（`dedupe_key` で突き合わせるので、同じ曲の別の盤にも効く）。
#
# ⚠ **曲データに 1 行も当たらない名前があれば、取り込みが警告を出す**（`video: unused`）。
#   🔴 **配信が終わったか、書き間違えている合図**なので、その行を見直す。

