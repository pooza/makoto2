# 同じ曲だが表記が違うものの一覧（#123）
#
# ⚠⚠ **訂正表（track_corrections.yaml）とは別物。**扱いが正反対になる。
#
#   ⚠ 供給元の誤記  `夢見る奇跡たち`（正は `夢みる`）
#                  → **片方が間違っている。訂正表で直す**（表示も変わる）
#   🔴 表記ゆれ      `五匹の子ぶた` / `ごひきのこぶた`
#                  → **どちらも正しい。ここで「同じ曲」と宣言する**（表示は変えない）
#
# ## 🔴 なぜ規則で解けないか
#
# ⚠ **読み仮名を持っていない。**⚠⚠ **かな化しても「五匹」が `ごひき` か `ごきひ` かは
#   辞書が要る**し、**同音別曲を潰す危険**が出る（サントラのキュー名に同名別曲が多い）。
#
# 🔴 **だから規則ではなく、気づいたものを 1 件ずつ書く表にする。**
#
# ## 書き方
#
#   - names:   ⚠ **同じ曲を指す表記を全部並べる。**🔴 **先頭が代表**
#              （**鍵になるだけで、投稿に出る曲名は 1 文字も変えない**）
#     noticed: 気づいた日
#     reason:  ⚠ **なぜ同じ曲だと判断したか。**これが無いと、後から見て消せない
#
# ⚠ **表記の突き合わせは正規化した後**（NFKC・約物落とし・小文字化）。⚠⚠ **半角/全角や
#   `♪` の有無はここに書かなくてよい** — **`TrackImporter::NOISE` が先に吸収する。**
#
# ⚠ **1 行も当たらない表記があれば、取り込みが警告を出す**（`alias: unused`）。
#   🔴 **供給元が表記を揃えた合図**なので、その行はもう消せる。

- names:
    - 五匹の子ぶたとチャールストン
    - ごひきのこぶたとチャールストン
  noticed: 2026-09-07
  reason: |-
    同じ曲（宮本佳那子 & 高橋秀幸）の漢字表記とかな表記。⚠ どちらも誤記ではなく、
    盤によって表記が違うだけ。実データでは漢字が 2 行（コロムビアキッズ こどものうた /
    こどものうた~VAMOLA!キョウリュウジャー~）、かなが 2 行（コロムビアキッズ わくわく
    どうぶつ / ショコラちゃんとうたおう どうよう）。
    ⚠⚠ 4 行とも live なので、寄せないと 8 時間のセットリストに同じ曲が 2 回出る。

- names:
    - 南の島のハメハメハ大王
    - みなみのしまのハメハメハだいおう
  noticed: 2026-09-07
  reason: |-
    同じ曲（高橋秀幸 & 宮本佳那子）の漢字表記とかな表記。⚠ 上と同じ形で、
    漢字が 3 行、かなが 1 行（おやこでいっしょに♪どうよう）。
    ⚠⚠ 元は童謡なので「大王」と「だいおう」はどちらも普通に使われる表記。
