# `kind` の分類を正す表（#304 / #307）
#
# ⚠⚠ **曲名の訂正表（track_corrections.yaml）とは別物。**
#
#   訂正表       供給元（iTunes）が曲名を間違えている → **曲名を直す**
#   🔴 この表    収集側の分類（`kind`）が外れている   → **`kind` だけを直す**（曲名は変えない）
#
# ⚠ `kind` は iTunes 由来のフィールドではなく、収集のときにこちらが付けた分類
#   （→ docs/track-corpus.md）。⚠⚠ **分類の段は `seed/track_kind.py`**（#294）で、
#   `itunes_corpus.py` は既存の行を 1 文字も変えない ＝ **流し直しても分類は戻らない**
#   （🔴 2026-09-19 に記述を直した = #315。それまでは「戻るから」と書いていた）。
# 🔴 **それでも `seed/` の JSON を手で直さず、取り込みのときに当てる。**理由は 2 つ:
#   下の `from` の歯止め（上流が直った日に当たらなくなり、警告に出る ＝ 消せる）と、
#   `reason` の記録（なぜ外れていると判断したか）。
#
# 🔴 **曲紹介の前置きは `kind` で書き分ける**（#293）ので、⚠ **歌の無い曲が `vocal` に
#   入っていると歌向けの前置き（`song_vocal`）が付く。**
#
# ## 書き方
#
#   - id:      iTunes の trackId（⚠ **分類は行ごと**なので、曲名ではなく行で当てる）
#     from:    いまの分類。⚠ **一致しなければ正さない**
#     to:      正しい分類（⚠ `/track/weight` にある `kind` だけ）
#     noticed: 気づいた日
#     reason:  ⚠ **なぜ外れていると判断したか。**これが無いと、後から見て消せない
#
# ⚠ `from` が一致しなくなったら、**この行はもう消せる**。取り込みが警告を出す
#   （`track: kind`。訂正表と同じく `fixed` / `unknown`）。

