# 歌ではなく語りのトラックの一覧（#298）
#
# ⚠⚠ **ボイスドラマ・朗読劇・トークは、供給元（iTunes）が歌と同じ `vocal` で返す。**
#   曲紹介の前置きは曲の種類で書き分けるので（#293）、そのままだと歌向けの前置き
#   （`song_vocal`・「思わず口ずさんじゃう」のような文）がドラマに付く。
#
# 🔴 **ここに書いた曲には、共通の前置き（`song`）だけを付ける。**
#   ⚠ 共通はどの曲にも合う文だけで書くので、判定に迷う曲はこちらへ倒せば外さない。
#
# ⚠ **表が言うのは「語りのトラックだ」という事実だけ。**どう扱うかは使う側が決める
#   （曲紹介は共通の前置きだけ。ライブの朗読劇（#287）は別の話）。
#
# ## 🔴 なぜ規則で解けないか
#
# ⚠ **名前で分からないものがある**（`もしもドリーマー…` は朗読劇だが、名前にそう書いていない）。
# ⚠ **尺で切ると普通の長い曲を巻き込む**（11 分のメドレー・8 分半の劇伴）うえ、
#   曲データが増えると基準がずれる（#294）。
# ⚠⚠ **新しい `kind` にも分けない** — 抽選の重みは `kind` ごとなので、3 曲しかない
#   `kind` が 5.9% 出てしまう（→ docs/track-corpus.md）。
#
# 🔴 **だから気づいたものを 1 件ずつ書く表にする**（訂正表 #58・別名表 #123 と同じ形）。
#
# ## 書き方
#
#   - name:    曲名（⚠ 供給元の表記のまま。突き合わせは `dedupe_key` ＝ 正規化と別名表の後）
#     noticed: 気づいた日
#     reason:  ⚠ **なぜ語りのトラックだと判断したか。**これが無いと、後から見て消せない
#
# ⚠ **盤違いは 1 行で済む**（`dedupe_key` で突き合わせるので、同じ曲の別の盤にも効く）。
#
# ⚠ **曲データに 1 行も当たらない名前があれば、取り込みが警告を出す**（`spoken: unused`）。
#   🔴 **配信が終わったか、書き間違えている合図**なので、その行を見直す。

