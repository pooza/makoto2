# 供給元（iTunes / Apple Music）が間違えている曲名の訂正表（#58）
#
# ⚠⚠ **「表記ゆれ」とは別物。**扱いが正反対になる。
#
#   表記ゆれ       `ガンバランス de ダンス` / `ガンバランスdeダンス`
#                  → **正規化で吸収する**（`TrackImporter.dedupe_key`）
#   ⚠ 供給元の誤記  `夢見る奇跡たち`（正は `夢みる`）
#                  → **正規化では解けない。ここに登録する**
#
# ⚠ **かなの揺れを一般に吸収する規則を書かない。**別の曲を潰す危険のほうが大きい
#   （ライブ用 vocal の `dedupe_key` を総当たりしても、この種の取りこぼしは 1 件だけ）。
#
# ⚠⚠ **この表を肥大化させない。**入れてよいのは「供給元が間違えている」ものだけ。
#
# ## 書き方
#
#   - id:      iTunes の trackId（自然キー）
#     from:    供給元が返してくる誤った曲名。⚠ **一致しなければ訂正しない**
#     to:      正しい曲名
#     noticed: 気づいた日
#     reason:  ⚠ **なぜ誤記と判断したか。**これが無いと、後から見て消せない
#
# ⚠ `from` が一致しなくなったら、**この行はもう消せる**。取り込みが警告を出す。
#
#   state: fixed    供給元が直した（曲名が `to` と一致した）
#   state: unknown  供給元が別の何かに変えた。⚠ **訂正表そのものを見直す**
#
# ⚠⚠ **`fixed` を黙らせないこと。****上流が直すときの一番ありふれた形**がこれで、
#   素通しにすると「消せる」合図が永久に出ない（#72 のレビュー指摘）。

- id: 404755348
  from: ガンバランスdeダンス ~夢見る奇跡たち~
  to: ガンバランスdeダンス ~夢みる奇跡たち~
  noticed: 2026-08-14
  reason: |-
    「みる」が正しく、「見る」が誤記。カバーではなく同じ音源の盤違いで、
    シングル EP（trackId 405905342）は アルバム名そのものが「夢みる奇跡たち」。
    間違えているのは公式アルバム（Yes! プリキュア5 VocalアルバムⅡ）の曲目リストのほう。
    ⚠ 訂正しないと dedupe_key が割れ、ライブの下見で 12:11 と 12:14 に
    ほぼ同じ曲名が隣接して出る（#13 の下見・リハーサルで実際に投稿された）。
    ⚠ かな子さんのカバー盤にも同じ誤記があるが、あちらは第三者の企画盤で
    cure-api の /singers に居ないため母集合に入らない（対象外）。
